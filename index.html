<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e27">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AeroEN">
<link rel="manifest" href="./manifest.json">
<title>AeroEN — Авиационный английский</title>
<style>
:root {
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --accent-soft: rgba(99, 102, 241, 0.15);
  --success: #10b981;
  --success-soft: rgba(16, 185, 129, 0.15);
  --danger: #ef4444;
  --danger-soft: rgba(239, 68, 68, 0.15);
  --warning: #f59e0b;
  --warning-soft: rgba(245, 158, 11, 0.15);
  --info: #06b6d4;

  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg: 0 20px 50px rgba(0,0,0,0.15);
  --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  --bg: #0a0e27;
  --bg-gradient: radial-gradient(circle at 20% 0%, #1a1f4e 0%, #0a0e27 50%),
                 radial-gradient(circle at 80% 100%, #1e1b4b 0%, transparent 50%);
  --surface: rgba(30, 34, 66, 0.6);
  --surface-solid: #151a35;
  --surface-hover: rgba(45, 50, 90, 0.8);
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.15);
  --text: #f1f5f9;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --overlay: rgba(10, 14, 39, 0.8);
}

[data-theme="light"] {
  --bg: #f8fafc;
  --bg-gradient: radial-gradient(circle at 20% 0%, #e0e7ff 0%, #f8fafc 50%),
                 radial-gradient(circle at 80% 100%, #ede9fe 0%, transparent 50%);
  --surface: rgba(255, 255, 255, 0.85);
  --surface-solid: #ffffff;
  --surface-hover: rgba(241, 245, 249, 0.95);
  --border: rgba(15, 23, 42, 0.08);
  --border-strong: rgba(15, 23, 42, 0.15);
  --text: #0f172a;
  --text-dim: #475569;
  --text-muted: #94a3b8;
  --overlay: rgba(255, 255, 255, 0.85);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom);
  transition: background-color var(--transition), color var(--transition);
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 20px 16px 100px;
  padding-top: max(20px, env(safe-area-inset-top));
  min-height: 100vh;
}

.top-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.logo-slot {
  width: 40px; height: 40px; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), var(--info));
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 18px; color: #fff;
  flex-shrink: 0; overflow: hidden;
  box-shadow: 0 4px 12px var(--accent-soft);
}
.brand-text { min-width: 0; flex: 1; }
.brand-name {
  font-weight: 800; font-size: 17px; letter-spacing: -0.3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.brand-sub {
  font-size: 11px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text-dim); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition); flex-shrink: 0;
  backdrop-filter: blur(10px);
}
.icon-btn:hover { background: var(--surface-hover); color: var(--text); border-color: var(--border-strong); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn svg { width: 20px; height: 20px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow);
  transition: all var(--transition);
}

.hero {
  background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
  border-radius: var(--radius-xl);
  padding: 22px;
  color: #fff;
  position: relative;
  overflow: hidden;
  margin-bottom: 16px;
  box-shadow: 0 20px 40px -12px rgba(99, 102, 241, 0.5);
}
.hero::before {
  content: ''; position: absolute; top: -50%; right: -20%;
  width: 240px; height: 240px;
  background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 70%);
  border-radius: 50%; pointer-events: none;
}
.hero-content { position: relative; z-index: 1; }
.hero-greeting { font-size: 13px; opacity: 0.85; margin-bottom: 4px; }
.hero-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 16px; line-height: 1.2; }
.hero-progress { background: rgba(255,255,255,0.2); border-radius: 100px; height: 6px; overflow: hidden; margin-bottom: 8px; }
.hero-progress-fill {
  height: 100%; background: #fff; border-radius: 100px;
  transition: width 500ms cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 12px rgba(255,255,255,0.5);
}
.hero-stats { display: flex; justify-content: space-between; align-items: center; font-size: 13px; opacity: 0.95; }
.hero-stats b { font-weight: 800; font-size: 15px; }

.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.action-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px;
  cursor: pointer;
  transition: all var(--transition);
  text-align: left; color: var(--text);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; gap: 10px;
  min-height: 130px;
}
.action-tile:not(:disabled):hover {
  border-color: var(--border-strong);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.action-tile:not(:disabled):active { transform: translateY(0) scale(0.98); }
.action-tile:disabled { opacity: 0.45; cursor: not-allowed; }
.action-tile.wide { grid-column: span 2; }
.tile-icon {
  width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.tile-icon svg { width: 22px; height: 22px; }
.tile-icon.accent { background: var(--accent-soft); color: var(--accent); }
.tile-icon.success { background: var(--success-soft); color: var(--success); }
.tile-icon.danger { background: var(--danger-soft); color: var(--danger); }
.tile-content { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
.tile-title { font-weight: 700; font-size: 15px; letter-spacing: -0.2px; margin-bottom: 2px; }
.tile-sub { font-size: 12px; color: var(--text-muted); }

.mini-stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; margin-bottom: 16px;
}
.stat-pill {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  text-align: center;
  backdrop-filter: blur(20px);
}
.stat-pill-value { font-weight: 800; font-size: 20px; letter-spacing: -0.5px; line-height: 1.1; }
.stat-pill-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-pill.streak .stat-pill-value { color: var(--warning); }
.stat-pill.due .stat-pill-value { color: var(--accent); }
.stat-pill.difficult .stat-pill-value { color: var(--danger); }

.deck-selector {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
  margin-bottom: 16px;
  backdrop-filter: blur(20px);
}
.deck-selector:hover { border-color: var(--border-strong); background: var(--surface-hover); }
.deck-selector-icon {
  width: 32px; height: 32px; border-radius: 10px;
  background: var(--accent-soft); color: var(--accent);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.deck-selector-icon svg { width: 18px; height: 18px; }
.deck-selector-info { flex: 1; min-width: 0; }
.deck-selector-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deck-selector-meta { font-size: 12px; color: var(--text-muted); }
.deck-selector-arrow { color: var(--text-muted); flex-shrink: 0; }
.deck-selector-arrow svg { width: 18px; height: 18px; }

.deck-list { display: grid; gap: 10px; }
.deck-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  cursor: pointer;
  transition: all var(--transition);
  display: flex; align-items: center; gap: 12px;
  backdrop-filter: blur(20px);
}
.deck-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.deck-card.active { border-color: var(--accent); background: var(--accent-soft); }
.deck-card.system { background: linear-gradient(135deg, rgba(99,102,241,0.08) 0%, rgba(139,92,246,0.05) 100%); }
.deck-card-icon {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--accent-soft); color: var(--accent);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.deck-card-icon svg { width: 20px; height: 20px; }
.deck-card-icon.system { background: linear-gradient(135deg, var(--accent), #8b5cf6); color: #fff; }
.deck-card-info { flex: 1; min-width: 0; }
.deck-card-name { font-weight: 700; font-size: 15px; letter-spacing: -0.2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.deck-card-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.deck-card-actions { display: flex; gap: 4px; }
.badge-system {
  display: inline-block; font-size: 9px; background: var(--accent);
  color: #fff; padding: 2px 6px; border-radius: 4px;
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
}

.quiz-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.quiz-progress-track {
  flex: 1; height: 8px; background: var(--surface);
  border-radius: 100px; overflow: hidden; border: 1px solid var(--border);
}
.quiz-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--info));
  border-radius: 100px;
  transition: width 400ms cubic-bezier(0.4, 0, 0.2, 1);
}
.quiz-counter {
  font-size: 13px; font-weight: 700; color: var(--text-dim);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.quiz-meta {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; color: var(--text-muted); margin-bottom: 12px;
  flex-wrap: wrap; gap: 6px;
}
.quiz-meta .badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 100px;
  font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.5px; font-size: 10px;
}

.question-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 40px 24px;
  text-align: center;
  margin-bottom: 16px;
  backdrop-filter: blur(20px);
  box-shadow: var(--shadow-lg);
  min-height: 200px;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  position: relative; overflow: hidden;
}
.question-card::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0.5;
}
.question-dir {
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
  color: var(--accent); text-transform: uppercase; margin-bottom: 16px;
}
.question-text {
  font-size: 32px; font-weight: 800; letter-spacing: -1px;
  line-height: 1.2; word-break: break-word;
}

.options-grid { display: grid; gap: 10px; }
.option-btn {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  font-size: 15px; font-weight: 600;
  text-align: left; cursor: pointer; color: var(--text);
  transition: all 180ms cubic-bezier(0.4, 0, 0.2, 1);
  display: flex; align-items: center; gap: 12px;
  backdrop-filter: blur(20px);
  position: relative; overflow: hidden;
}
.option-btn:hover:not(:disabled) { border-color: var(--accent); transform: translateX(4px); }
.option-btn:active:not(:disabled) { transform: translateX(4px) scale(0.99); }
.option-btn .option-key {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--surface-hover); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; flex-shrink: 0; color: var(--text-muted);
  position: relative; z-index: 1;
}
.option-btn .option-text { position: relative; z-index: 1; flex: 1; }
.option-btn.correct { border-color: var(--success); background: var(--success-soft); animation: correctPulse 500ms ease; }
.option-btn.correct .option-key { background: var(--success); color: #fff; border-color: var(--success); }
.option-btn.wrong { border-color: var(--danger); background: var(--danger-soft); animation: shake 400ms ease; }
.option-btn.wrong .option-key { background: var(--danger); color: #fff; border-color: var(--danger); }
.option-btn:disabled { cursor: default; opacity: 0.75; }
.option-btn.correct:disabled, .option-btn.wrong:disabled { opacity: 1; }

@keyframes correctPulse {
  0% { box-shadow: 0 0 0 0 var(--success-soft); }
  50% { box-shadow: 0 0 0 8px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
@keyframes shake {
  0%, 100% { transform: translateX(4px); }
  25% { transform: translateX(-2px); }
  75% { transform: translateX(8px); }
}

.typing-wrap { display: grid; gap: 12px; }
.typing-input {
  width: 100%; padding: 18px 20px;
  font-size: 17px; font-weight: 600;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  text-align: center; outline: none; color: var(--text);
  transition: all var(--transition);
  backdrop-filter: blur(20px);
}
.typing-input::placeholder { color: var(--text-muted); font-weight: 400; }
.typing-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.typing-input.correct { border-color: var(--success); background: var(--success-soft); }
.typing-input.wrong { border-color: var(--danger); background: var(--danger-soft); }
.typing-feedback { text-align: center; font-size: 14px; font-weight: 600; min-height: 22px; }
.typing-feedback.correct { color: var(--success); }
.typing-feedback.wrong { color: var(--danger); }

.recall-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 40px 24px;
  text-align: center;
  backdrop-filter: blur(20px);
  box-shadow: var(--shadow-lg);
}
.recall-hint { color: var(--text-dim); font-size: 14px; margin-bottom: 20px; }

.flashcard-wrap { perspective: 1200px; margin-bottom: 16px; }
.flashcard {
  position: relative; width: 100%; min-height: 280px;
  cursor: pointer;
  transition: transform 600ms cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d;
}
.flashcard.flipped { transform: rotateY(180deg); }
.flashcard-face {
  position: absolute; inset: 0;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  padding: 40px 24px; text-align: center;
  box-shadow: var(--shadow-lg);
  backdrop-filter: blur(20px);
}
.flashcard-back { transform: rotateY(180deg); }
.flashcard-badge {
  font-size: 11px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 1.5px;
  font-weight: 700; margin-bottom: 20px;
}
.flashcard-word {
  font-size: 32px; font-weight: 800; letter-spacing: -1px;
  line-height: 1.2; word-break: break-word;
}
.flashcard-back .flashcard-word { color: var(--accent); }
.flashcard-tap-hint { font-size: 12px; color: var(--text-muted); margin-top: 24px; }

.rating-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rating-btn {
  padding: 14px 6px; border: none; border-radius: var(--radius);
  font-size: 13px; font-weight: 700; cursor: pointer; color: #fff;
  transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.rating-btn:active { transform: scale(0.95); }
.rating-btn.again { background: var(--danger); box-shadow: 0 4px 12px var(--danger-soft); }
.rating-btn.hard  { background: var(--warning); box-shadow: 0 4px 12px var(--warning-soft); }
.rating-btn.good  { background: var(--success); box-shadow: 0 4px 12px var(--success-soft); }
.rating-btn.easy  { background: var(--info); box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3); }
.rating-btn .rating-interval { font-size: 10px; font-weight: 500; opacity: 0.85; }

.result-card { text-align: center; padding: 40px 24px; }
.result-emoji { font-size: 64px; margin-bottom: 16px; line-height: 1; }
.result-title { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
.result-sub { color: var(--text-dim); font-size: 15px; margin-bottom: 24px; }
.result-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
.result-stat-value { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
.result-stat-value.good { color: var(--success); }
.result-stat-value.bad  { color: var(--danger); }
.result-stat-label {
  font-size: 11px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 22px;
  background: var(--accent); color: #fff;
  border: none; border-radius: var(--radius);
  font-size: 14px; font-weight: 700; cursor: pointer;
  transition: all var(--transition);
  text-decoration: none; letter-spacing: -0.1px;
}
.btn:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 8px 20px var(--accent-soft); }
.btn:active { transform: translateY(0); }
.btn.secondary {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border);
  backdrop-filter: blur(20px);
}
.btn.secondary:hover { background: var(--surface-hover); border-color: var(--border-strong); box-shadow: var(--shadow); }
.btn.ghost { background: transparent; color: var(--text-dim); border: 1px solid transparent; }
.btn.ghost:hover { background: var(--surface); color: var(--text); }
.btn.danger { background: var(--danger); }
.btn.danger:hover { background: #dc2626; box-shadow: 0 8px 20px var(--danger-soft); }
.btn.full { width: 100%; }
.btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* ====== УМЕНЬШЕННЫЕ КНОПКИ ДЛЯ ИМПОРТ/ЭКСПОРТ ====== */
.btn.btn-compact { padding: 8px 14px; font-size: 12px; gap: 5px; }
.btn.btn-compact svg { width: 14px; height: 14px; }

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--overlay);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-top: 1px solid var(--border);
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  display: flex; justify-content: space-around; z-index: 100;
  max-width: 720px; margin: 0 auto;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 4px; background: none; border: none;
  color: var(--text-muted); cursor: pointer;
  transition: color var(--transition); border-radius: 10px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.3px;
}
.nav-item:hover { color: var(--text); }
.nav-item.active { color: var(--accent); }
.nav-item svg { width: 22px; height: 22px; }

.form-row { display: grid; gap: 8px; margin-bottom: 16px; }
.form-row label {
  font-size: 12px; font-weight: 700; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.5px;
}
.input, .select {
  width: 100%; padding: 12px 14px;
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); outline: none;
  transition: all var(--transition); color: var(--text); font-weight: 500;
}
.input:focus, .select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.radio-group { display: flex; gap: 8px; flex-wrap: wrap; }

  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
};

/* =========================================================================
   ХРАНИЛИЩЕ
   ========================================================================= */
const LS_DECKS    = 'av_decks_v2';
const LS_WORDS    = 'av_words_v2';
const LS_PROGRESS = 'av_progress_v2';
const LS_DIFFICULT= 'av_difficult_v2';
const LS_SETTINGS = 'av_settings_v2';
const LS_STATS    = 'av_stats_v2';
const LS_REMIND   = 'av_reminder_v2';
const LS_THEME    = 'av_theme_v2';

const SYSTEM_DECKS = [
  { id: 'system-aviation-english', url: './aviation-english.json' },
  { id: 'system-icao-alphabet',    url: './icao-alphabet.json' },
];

let decks = [];
let activeDeckId = null;
let wordsByDeck = {};
let progressByDeck = {};
let difficultByDeck = {};
let theme = 'dark';

let settings = {
  newPerDay: 20, maxInterval: 365, easyBonus: 1.3, hardFactor: 0.6,
  startingEase: 2.5, direction: 'en-ru', recallFirst: true,
  quizMode: 'mixed', quizSize: 20, mixDirections: false,
  retryMistakes: true, dailyGoal: 20, prioritizeHard: true,
  difficultToExit: 2,
};
let stats = { streak: 0, lastStudyDate: null, dailyCounts: {} };
let reminder = { enabled: false, time: '19:00', lastShown: null };

function saveDecks() { localStorage.setItem(LS_DECKS, JSON.stringify({ decks, activeDeckId })); }
function saveWordsMap() { localStorage.setItem(LS_WORDS, JSON.stringify(wordsByDeck)); }
function saveProgressMap() { localStorage.setItem(LS_PROGRESS, JSON.stringify(progressByDeck)); }
function saveDifficultMap() { localStorage.setItem(LS_DIFFICULT, JSON.stringify(difficultByDeck)); }
function saveSettings() { localStorage.setItem(LS_SETTINGS, JSON.stringify(settings)); }
function saveStats() { localStorage.setItem(LS_STATS, JSON.stringify(stats)); }
function saveReminder() { localStorage.setItem(LS_REMIND, JSON.stringify(reminder)); }
function saveTheme() { localStorage.setItem(LS_THEME, theme); }
function saveAll() {
  saveDecks(); saveWordsMap(); saveProgressMap(); saveDifficultMap();
  saveSettings(); saveStats(); saveReminder(); saveTheme();
}

function loadAll() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_DECKS) || '{}');
    decks = d.decks || [];
    activeDeckId = d.activeDeckId || (decks[0] && decks[0].id) || null;
  } catch { decks = []; activeDeckId = null; }
  try { wordsByDeck = JSON.parse(localStorage.getItem(LS_WORDS) || '{}'); } catch { wordsByDeck = {}; }
  try { progressByDeck = JSON.parse(localStorage.getItem(LS_PROGRESS) || '{}'); } catch { progressByDeck = {}; }
  try { difficultByDeck = JSON.parse(localStorage.getItem(LS_DIFFICULT) || '{}'); } catch { difficultByDeck = {}; }
  try { settings = Object.assign(settings, JSON.parse(localStorage.getItem(LS_SETTINGS) || '{}')); } catch {}
  try { stats = Object.assign(stats, JSON.parse(localStorage.getItem(LS_STATS) || '{}')); } catch {}
  try { reminder = Object.assign(reminder, JSON.parse(localStorage.getItem(LS_REMIND) || '{}')); } catch {}
  try { theme = localStorage.getItem(LS_THEME) || 'dark'; } catch { theme = 'dark'; }
  applyTheme();
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', theme);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a0e27' : '#f8fafc');
}
function toggleTheme() {
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme(); saveTheme();
}

function getWords(deckId = activeDeckId) { return wordsByDeck[deckId] || []; }
function setWords(arr, deckId = activeDeckId) { wordsByDeck[deckId] = arr; saveWordsMap(); }
function getProgress(deckId = activeDeckId) {
  if (!progressByDeck[deckId]) progressByDeck[deckId] = {};
  return progressByDeck[deckId];
}
function getDifficult(deckId = activeDeckId) {
  if (!difficultByDeck[deckId]) difficultByDeck[deckId] = {};
  return difficultByDeck[deckId];
}
function deckName(id) { const d = decks.find(x => x.id === id); return d ? d.name : '—'; }
function activeDeck() { return decks.find(d => d.id === activeDeckId); }
function isSystemDeck(id) { const d = decks.find(x => x.id === id); return d && d.system === true; }
function uid() { return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* =========================================================================
   ЗАГРУЗКА СИСТЕМНЫХ КОЛОД С ХОСТИНГА
   ========================================================================= */
async function loadSystemDecks() {
  for (const sd of SYSTEM_DECKS) {
    const existing = decks.find(d => d.id === sd.id);
    try {
      const res = await fetch(sd.url + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) continue;
      const data = await res.json();
      if (!data || !Array.isArray(data.words)) continue;

      if (existing) {
        // Обновляем, если количество слов изменилось. Прогресс сохраняется (привязка по en).
        const currentCount = (wordsByDeck[sd.id] || []).length;
        if (currentCount !== data.words.length) {
          wordsByDeck[sd.id] = data.words.map(w => ({
            en: w.en, ru: w.ru, created: w.created || todayStr()
          }));
          saveWordsMap();
        }
        if (data.name && existing.name !== data.name) {
          existing.name = data.name; saveDecks();
        }
      } else {
        // Создаём новую системную колоду
        decks.push({
          id: sd.id,
          name: data.name || sd.id,
          createdAt: todayStr(),
          system: true,
        });
        wordsByDeck[sd.id] = data.words.map(w => ({
          en: w.en, ru: w.ru, created: w.created || todayStr()
        }));
        if (!progressByDeck[sd.id]) progressByDeck[sd.id] = {};
        if (!difficultByDeck[sd.id]) difficultByDeck[sd.id] = {};
        saveAll();
      }
    } catch (e) {
      // Нет интернета или файл недоступен — работаем с кэшем
    }
  }
  saveAll();
}

/* =========================================================================
   УТИЛИТЫ
   ========================================================================= */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(days) {
  const d = new Date(); d.setDate(d.getDate() + Math.max(0, Math.round(days)));
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function intervalLabel(days) {
  if (days <= 0) return 'Снова';
  if (days === 1) return 'Несложно';
  if (days < 30) return days + ' дн.';
  if (days < 365) return Math.round(days / 30) + ' мес.';
  return Math.round(days / 365 * 10) / 10 + ' г.';
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalize(s) {
  return String(s).toLowerCase().trim()
    .replace(/[.,!?;:()"'\-–—]/g, ' ').replace(/\s+/g, ' ').trim();
}
function answerMatches(input, correct) {
  const a = normalize(input), b = normalize(correct);
  if (a === b) return true;
  const parts = b.split(/[,/]/).map(s => s.trim()).filter(Boolean);
  return parts.includes(a);
}
function greeting() {
  const h = new Date().getHours();
  if (h < 5) return 'Доброй ночи';
  if (h < 12) return 'Доброе утро';
  if (h < 18) return 'Добрый день';
  return 'Добрый вечер';
}

/* =========================================================================
   ИМПОРТ / ЭКСПОРТ
   ========================================================================= */
function parseAny(text) {
  const lines = text.split(/\r?\n/); const result = [];
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith('#')) continue;
    let parts;
    if (trimmed.includes('\t')) parts = trimmed.split('\t');
    else if (trimmed.includes(';')) parts = trimmed.split(';');
    else parts = trimmed.split(',');
    if (parts.length < 2) continue;
    const en = parts[0].trim().replace(/^"|"$/g, '');
    const ru = parts[1].trim().replace(/^"|"$/g, '');
    if (en && ru) result.push({ en, ru, created: todayStr() });
  }
  return result;
}
function parseCSV(text) {
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') {}
      else field += c;
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  let start = 0;
  if (rows.length && rows[0].length >= 2) {
    const h0 = rows[0][0].toLowerCase().trim();
    if (['en','english','слово','английский'].includes(h0)) start = 1;
  }
  const result = [];
  for (let i = start; i < rows.length; i++) {
    const r = rows[i];
    if (!r || r.length < 2) continue;
    const en = String(r[0]).trim(); const ru = String(r[1]).trim();
    if (en && ru) result.push({ en, ru, created: todayStr() });
  }
  return result;
}
function toCSV(rows) {
  const esc = v => {
    const s = String(v ?? '');
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return 'en,ru\n' + rows.map(r => esc(r.en) + ',' + esc(r.ru)).join('\n');
}
function toTSV(rows) { return rows.map(r => r.en + '\t' + r.ru).join('\n'); }
function download(content, filename, mime = 'text/plain') {
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* =========================================================================
   SRS
   ========================================================================= */
function getCard(en, deckId = activeDeckId) {
  const prog = getProgress(deckId);
  if (!prog[en]) {
    prog[en] = { interval: 0, ease: settings.startingEase, due: todayStr(), reps: 0, lapses: 0, history: [] };
  }
  return prog[en];
}
function schedule(card, quality) {
  let { interval, ease, reps, lapses } = card;
  if (quality === 0) {
    reps = 0; lapses += 1; ease = Math.max(1.3, ease - 0.2); interval = 0;
  } else {
    if (quality === 1) ease = Math.max(1.3, ease - 0.15);
    if (quality === 3) ease = Math.min(3.0, ease + 0.15);
    if (reps === 0) interval = 1;
    else if (reps === 1) interval = quality === 1 ? 2 : (quality === 3 ? 4 : 3);
    else {
      let mult = ease;
      if (quality === 1) mult *= settings.hardFactor;
      if (quality === 3) mult *= settings.easyBonus;
      interval = Math.round(interval * mult);
    }
    if (interval < 1) interval = 1;
    if (interval > settings.maxInterval) interval = settings.maxInterval;
    reps += 1;
  }
  return { interval, ease, reps, lapses };
}
function applyRating(en, quality, deckId = activeDeckId) {
  const card = getCard(en, deckId);
  const res = schedule(card, quality);
  card.interval = res.interval; card.ease = res.ease;
  card.reps = res.reps; card.lapses = res.lapses;
  card.due = addDays(res.interval);
  card.history.push({ date: todayStr(), quality });
  if (card.history.length > 50) card.history.shift();
  saveProgressMap();
  return card;
}
function dueWords(deckId = activeDeckId) {
  const today = todayStr();
  return getWords(deckId).filter(w => {
    const c = getProgress(deckId)[w.en];
    return !c || c.due <= today;
  });
}
function wordStatus(en, deckId = activeDeckId) {
  const c = getProgress(deckId)[en];
  if (!c || c.reps === 0) return 'new';
  if (c.interval < 1) return 'learning';
  if (c.interval < 21) return 'young';
  return 'mature';
}
function difficultyScore(en, deckId = activeDeckId) {
  const c = getProgress(deckId)[en];
  if (!c) return 1;
  return 1 + c.lapses * 2 - c.ease;
}

function markDifficult(en, deckId = activeDeckId) {
  const diff = getDifficult(deckId);
  if (!diff[en]) diff[en] = { streak: 0, wrongs: 0, lastAdded: todayStr() };
  diff[en].streak = 0;
  diff[en].wrongs += 1;
  diff[en].lastAdded = todayStr();
  saveDifficultMap();
}
function markCorrectDifficult(en, deckId = activeDeckId) {
  const diff = getDifficult(deckId);
  if (!diff[en]) return;
  diff[en].streak += 1;
  if (diff[en].streak >= (settings.difficultToExit || 2)) delete diff[en];
  saveDifficultMap();
}
function isDifficult(en, deckId = activeDeckId) { return !!getDifficult(deckId)[en]; }
function difficultWords(deckId = activeDeckId) {
  const diff = getDifficult(deckId);
  return getWords(deckId).filter(w => diff[w.en]);
}

function updateStreak() {
  const today = todayStr();
  if (stats.lastStudyDate === today) return;
  if (stats.lastStudyDate) {
    const diff = daysBetween(stats.lastStudyDate, today);
    if (diff === 1) stats.streak += 1;
    else if (diff > 1) stats.streak = 1;
  } else stats.streak = 1;
  stats.lastStudyDate = today;
  saveStats();
}
function incrementDailyCount(n = 1) {
  const today = todayStr();
  stats.dailyCounts[today] = (stats.dailyCounts[today] || 0) + n;
  const cutoff = addDays(-60);
  for (const d of Object.keys(stats.dailyCounts)) if (d < cutoff) delete stats.dailyCounts[d];
  saveStats();
}
function todayCount() { return stats.dailyCounts[todayStr()] || 0; }

function pickDistractors(correct, pool, count = 3) {
  const candidates = pool.filter(w => !(w.en === correct.en && w.ru === correct.ru));
  if (candidates.length <= count) return shuffle(candidates).slice(0, count);
  const scored = candidates.map(w => {
    let score = 0;
    if (w.ru[0] && correct.ru[0] && w.ru[0].toLowerCase() === correct.ru[0].toLowerCase()) score += 3;
    if (w.en[0] && correct.en[0] && w.en[0].toLowerCase() === correct.en[0].toLowerCase()) score += 2;
    score += Math.max(0, 3 - Math.abs(w.ru.length - correct.ru.length) / 3);
    score += Math.max(0, 2 - Math.abs(w.en.length - correct.en.length) / 3);
    score += Math.random() * 2;
    return { w, score };
  });
  scored.sort((a, b) => b.score - a.score);
  const top = scored.slice(0, Math.min(count * 3, scored.length)).map(x => x.w);
  return shuffle(top).slice(0, count);
}
function makeOptions(correct, direction, pool) {
  const getA = direction === 'en-ru' ? w => w.ru : w => w.en;
  const wrong = pickDistractors(correct, pool, 3).map(w => ({ ...w, _a: getA(w) }));
  return shuffle([{ ...correct, _a: getA(correct) }, ...wrong]);
}

let reminderTimer = null;
function notificationsSupported() { return 'Notification' in window; }
function notificationPermission() {
  return notificationsSupported() ? Notification.permission : 'unsupported';
}
function requestNotificationPermission() {
  return new Promise(resolve => {
    if (!notificationsSupported()) return resolve('unsupported');
    if (Notification.permission === 'granted') return resolve('granted');
    if (Notification.permission === 'denied') return resolve('denied');
    Notification.requestPermission().then(resolve);
  });
}
function showNotification(title, body) {
  if (notificationPermission() !== 'granted') return false;
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.ready.then(reg => {
        reg.showNotification(title, {
          body, tag: 'aeroen-reminder', renotify: true, vibrate: [100, 50, 100],
          data: { url: './' }
        });
      });
    } else {
      new Notification(title, { body, tag: 'aeroen-reminder' });
    }
    return true;
  } catch (e) { return false; }
}
function startReminderLoop() {
  if (reminderTimer) clearInterval(reminderTimer);
  reminderTimer = setInterval(checkReminder, 30000);
  checkReminder();
}
function checkReminder() {
  if (!reminder.enabled) return;
  if (notificationPermission() !== 'granted') return;
  const now = new Date();
  const current = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  const today = todayStr();
  if (stats.lastStudyDate === today) return;
  if (reminder.lastShown === today) return;
  if (current < reminder.time) return;
  const due = dueWords().length;
  const body = due > 0 ? `У вас ${due} слов к повторению. Не теряйте серию дней! 🔥` : `Пора позаниматься! 🔥`;
  if (showNotification('✈️ AeroEN — время учить', body)) {
    reminder.lastShown = today;
    saveReminder();
  }
}
function testNotification() {
  if (!showNotification('✈️ Тестовое уведомление', 'Если вы это видите — напоминания работают!')) {
    alert('Не удалось показать уведомление. Проверьте разрешение.');
  }
}

  const id = uid();

  progressByDeck[id] = {};
  difficultByDeck[id] = {};
  activeDeckId = id;
  saveAll();
  return id;

          if (!confirm(`Удалить «${d.name}»? Прогресс будет потерян.`)) return;
          decks = decks.filter(x => x.id !== d.id);
          delete wordsByDeck[d.id]; delete progressByDeck[d.id]; delete difficultByDeck[d.id];
          if (activeDeckId === d.id) activeDeckId = decks[0].id;
          saveAll(); renderDeckPicker();
        }
        return;
      }
      activeDeckId = d.id; saveDecks(); renderHome();
    });
    list.appendChild(el);
  });
}

let editorState = { search: '', sortBy: 'added', sortDir: 'asc', selected: new Set(), editingKey: null };
function wordKey(w) { return w.en + '|' + w.ru; }

function renderEditor() {

          <option value="ru" ${editorState.sortBy==='ru'?'selected':''}>A–Z Русский</option>

      </div>
    </div>

    ${sys ? '' : `
    <div class="card mb-16" style="padding:10px 12px;">

    document.getElementById('edSortDir').textContent = editorState.sortDir === 'asc' ? '↑ A→Z' : '↓ Z→A';

  });
  if (!sys) {
    document.getElementById('edAdd').addEventListener('click', addWordInline);

      const keys = new Set(editorState.selected);
      setWords(getWords().filter(w => !keys.has(wordKey(w))));
      const prog = getProgress();
      for (const key of keys) { const [en] = key.split('|'); delete prog[en]; }

function getFilteredWords() {
  const q = editorState.search.trim().toLowerCase();
  let arr = getWords().slice();
  if (q) arr = arr.filter(w => w.en.toLowerCase().includes(q) || w.ru.toLowerCase().includes(q));
  const dir = editorState.sortDir === 'asc' ? 1 : -1;
  arr.sort((a, b) => {
    if (editorState.sortBy === 'en') return a.en.localeCompare(b.en) * dir;
    if (editorState.sortBy === 'ru') return a.ru.localeCompare(b.ru) * dir;
    if (editorState.sortBy === 'status') {
      const order = { new: 0, learning: 1, young: 2, mature: 3 };
      return (order[wordStatus(a.en)] - order[wordStatus(b.en)]) * dir;
    }
    return ((a.created || '').localeCompare(b.created || '')) * dir;
  });
  return arr;
}

function renderEditorTable() {
  const wrap = document.getElementById('edTableWrap');
  if (!wrap) return;

  const sys = isSystemDeck(activeDeckId);
  if (getWords().length === 0) {

  filtered.forEach(w => {

    const st = wordStatus(w.en);
    const diff = isDifficult(w.en);
    const tr = document.createElement('tr');
    tr.dataset.key = key;
    if (isEditing && !sys) {
      tr.innerHTML = `

        </td>
      `;
    } else {
      tr.innerHTML = `
        ${sys ? '' : `<td><input type="checkbox" data-act="select" ${isSelected ? 'checked' : ''} style="accent-color:var(--accent);"></td>`}
        <td><b>${escapeHtml(w.en)}</b></td>
        <td>${escapeHtml(w.ru)}</td>
        <td>${diff ? '<span class="tag difficult">Сложное</span> ' : ''}<span class="tag ${st}">${statusName(st)}</span></td>

        <td style="white-space:nowrap;">
          <button class="icon-btn" data-act="edit" style="width:28px;height:28px;">${ICONS.edit}</button>
          <button class="icon-btn" data-act="delete" style="width:28px;height:28px;color:var(--danger);">${ICONS.trash}</button>
        </td>
        `}
      `;
    }
    tbody.appendChild(tr);
  });
  if (!sys) {
    tbody.addEventListener('click', e => {
      const btn = e.target.closest('button[data-act]');
      const tr = e.target.closest('tr');
      if (!tr) return;
      const key = tr.dataset.key;
      const word = getWords().find(w => wordKey(w) === key);
      if (!word) return;
      if (btn) {
        const a = btn.dataset.act;
        if (a === 'edit') { editorState.editingKey = key; renderEditorTable(); }
        else if (a === 'cancel') { editorState.editingKey = null; renderEditorTable(); }
        else if (a === 'save') saveEditedWord(tr, word);
        else if (a === 'delete') {
          if (!confirm(`Удалить «${word.en}»?`)) return;
          setWords(getWords().filter(w => wordKey(w) !== key));
          delete getProgress()[word.en];
          delete getDifficult()[word.en];
          saveProgressMap(); saveDifficultMap(); editorState.selected.delete(key); renderEditor();
        }
      }
    });
    tbody.addEventListener('change', e => {
      const cb = e.target.closest('input[data-act="select"]');
      if (!cb) return;
      const key = e.target.closest('tr').dataset.key;
      if (cb.checked) editorState.selected.add(key); else editorState.selected.delete(key);
    });
    tbody.querySelectorAll('input[data-field]').forEach(inp => {
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          const tr = e.target.closest('tr');
          const word = getWords().find(w => wordKey(w) === tr.dataset.key);
          if (word) saveEditedWord(tr, word);
        } else if (e.key === 'Escape') { editorState.editingKey = null; renderEditorTable(); }
      });
    });
    const first = tbody.querySelector('input[data-field]');
    if (first) first.focus();
  }
}

function saveEditedWord(tr, oldWord) {
  const newEn = tr.querySelector('input[data-field="en"]').value.trim();
  const newRu = tr.querySelector('input[data-field="ru"]').value.trim();
  if (!newEn || !newRu) { alert('Оба поля обязательны.'); return; }
  const dup = getWords().find(w => w !== oldWord && w.en === newEn && w.ru === newRu);
  if (dup) { alert('Такое слово уже есть.'); return; }
  const oldKey = wordKey(oldWord), oldEn = oldWord.en, newKey = newEn + '|' + newRu;
  oldWord.en = newEn; oldWord.ru = newRu;
  if (oldEn !== newEn) {
    const prog = getProgress();
    if (prog[oldEn]) { prog[newEn] = prog[oldEn]; delete prog[oldEn]; }
    const diff = getDifficult();
    if (diff[oldEn]) { diff[newEn] = diff[oldEn]; delete diff[oldEn]; }
  }
  if (editorState.selected.has(oldKey)) { editorState.selected.delete(oldKey); editorState.selected.add(newKey); }
  editorState.editingKey = null;
  saveAll(); renderEditorTable();
}

/* =========================================================================
   ВИКТОРИНА
   ========================================================================= */
let quiz = [], quizIndex = 0, quizScore = 0, quizAnswered = false, quizRevealed = false;
let quizMistakes = [], quizDirections = [], quizSource = 'all', quizPool = [];

function beginQuiz(source = 'all') {
  lastRender = () => beginQuiz(source);
  quizSource = source;
  const base = source === 'difficult' ? difficultWords() : getWords();
  quizPool = getWords();
  if (base.length === 0) { alert('Нет слов для тренировки.'); renderHome(); return; }
  let pool = base.slice();
  if (source !== 'difficult' && settings.prioritizeHard) {
    const weighted = [];
    pool.forEach(w => {
      const weight = Math.max(1, Math.round(difficultyScore(w.en)));
      for (let i = 0; i < weight; i++) weighted.push(w);
    });
    pool = shuffle(weighted);
    const seen = new Set();
    pool = pool.filter(w => { const k = w.en + '|' + w.ru; if (seen.has(k)) return false; seen.add(k); return true; });
  } else pool = shuffle(pool);
  if (settings.quizSize > 0 && source !== 'difficult') pool = pool.slice(0, settings.quizSize);
  quiz = pool;
  quizIndex = 0; quizScore = 0; quizMistakes = [];
  quizDirections = quiz.map(() => settings.direction === 'mix'
    ? (Math.random() < 0.5 ? 'en-ru' : 'ru-en') : settings.direction);
  renderQuizQuestion();
}
function currentMode() {
  if (settings.quizMode === 'mc') return 'mc';
  if (settings.quizMode === 'typing') return 'typing';
  return Math.random() < 0.5 ? 'mc' : 'typing';
}

function renderQuizQuestion() {
  lastRender = renderQuizQuestion;
  if (quizIndex >= quiz.length) return renderQuizResult();
  quizAnswered = false; quizRevealed = !settings.recallFirst;
  const word = quiz[quizIndex];
  const dir = quizDirections[quizIndex];
  const mode = currentMode();
  const qText = dir === 'en-ru' ? word.en : word.ru;
  const total = quiz.length;
  const percent = (quizIndex / total) * 100;
  const title = quizSource === 'difficult' ? 'Сложные' : 'Викторина';

  app.innerHTML = `

      <span class="badge">${mode === 'mc' ? 'Варианты' : 'Ввод'}</span>
      <span class="badge" style="color:var(--success);">✓ ${quizScore}</span>
      <span class="badge" style="color:var(--danger);">✗ ${quizMistakes.length}</span>
    </div>

    <div class="question-card">
      <div class="question-dir">${dir === 'en-ru' ? 'Переведите на русский' : 'Translate to English'}</div>
      <div class="question-text">${escapeHtml(qText)}</div>
    </div>

    <div id="stage"></div>
  `;
  bindTopBar({ onBack: () => { if (confirm('Выйти?')) renderHome(); } });

  if (quizRevealed) showAnswerUI(word, dir, mode);
  else showRecallPrompt(word, dir, mode);
}

function showRecallPrompt(word, dir, mode) {
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="recall-box">
      <div class="recall-hint">💭 Вспомните ответ, затем проверьте себя</div>
      <button class="btn full" id="showOpts">Показать ответ</button>
    </div>
  `;
  document.getElementById('showOpts').addEventListener('click', () => {
    quizRevealed = true; showAnswerUI(word, dir, mode);
  });
}

function showAnswerUI(word, dir, mode) {
  const stage = document.getElementById('stage');
  if (mode === 'mc') {
    const options = makeOptions(word, dir, quizPool);
    stage.innerHTML = `<div class="options-grid" id="options"></div>`;
    const el = document.getElementById('options');
    const keys = ['A', 'B', 'C', 'D'];
    options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.dataset.correct = (opt.en === word.en && opt.ru === word.ru) ? '1' : '0';
      btn.innerHTML = `
        <span class="option-key">${keys[i]}</span>
        <span class="option-text">${escapeHtml(opt._a)}</span>
      `;
      btn.addEventListener('click', () => {
        if (quizAnswered) return;
        const isCorrect = btn.dataset.correct === '1';
        document.querySelectorAll('.option-btn').forEach(b => {
          b.disabled = true;
          if (b.dataset.correct === '1') b.classList.add('correct');
        });
        if (!isCorrect) btn.classList.add('wrong');
        handleAnswer(isCorrect, word, dir, mode);
      });
      el.appendChild(btn);
    });
  } else {
    const correct = dir === 'en-ru' ? word.ru : word.en;
    stage.innerHTML = `
      <div class="typing-wrap">
        <input class="typing-input" id="typingInput" placeholder="Введите перевод..." autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="typing-feedback" id="feedback"></div>
        <button class="btn full" id="submitTyping">Проверить</button>
        <button class="btn ghost full" id="skipTyping">Не знаю</button>
      </div>
    `;
    const input = document.getElementById('typingInput');
    input.focus();
    const submit = () => {
      if (quizAnswered) return;
      const val = input.value.trim(); if (!val) return;
      const ok = answerMatches(val, correct);
      input.classList.add(ok ? 'correct' : 'wrong');
      const fb = document.getElementById('feedback');
      fb.textContent = ok ? '✓ Верно!' : `Правильный ответ: ${correct}`;
      fb.className = 'typing-feedback ' + (ok ? 'correct' : 'wrong');
      handleAnswer(ok, word, dir, mode);
    };
    document.getElementById('submitTyping').addEventListener('click', submit);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    document.getElementById('skipTyping').addEventListener('click', () => {
      if (quizAnswered) return;
      input.classList.add('wrong');
      const fb = document.getElementById('feedback');
      fb.textContent = `Правильный ответ: ${correct}`;
      fb.className = 'typing-feedback wrong';
      handleAnswer(false, word, dir, mode);
    });
  }
}

function handleAnswer(isCorrect, word, dir, mode) {
  if (quizAnswered) return;
  quizAnswered = true;
  if (isCorrect) { quizScore++; markCorrectDifficult(word.en); }
  else { quizMistakes.push({ word, dir, mode }); markDifficult(word.en); }
  applyRating(word.en, isCorrect ? 2 : 0);
  incrementDailyCount(1);
  updateStreak();
  setTimeout(() => {
    quizIndex++;
    if (quizIndex >= quiz.length) {
      if (settings.retryMistakes && quizMistakes.length > 0) {
        const retry = quizMistakes.slice();
        quizMistakes = [];
        retry.forEach(m => { quiz.push(m.word); quizDirections.push(m.dir); });
      }
      if (quizIndex >= quiz.length) renderQuizResult();
      else renderQuizQuestion();
    } else renderQuizQuestion();
  }, mode === 'typing' ? 1400 : 900);
}

/* =========================================================================
   КАРТОЧКИ — ИСПРАВЛЕН ПРЕДПРОСМОТР ИНТЕРВАЛОВ
   ========================================================================= */
let cardQueue = [], cardIndex = 0, cardFlipped = false, cardSessionDone = 0, cardSource = 'due';

function startCards(source = 'due') {
  cardSource = source;
  cardQueue = shuffle(dueWords());
  if (cardQueue.length === 0) { alert('Нет карточек к повторению.'); renderHome(); return; }
  cardIndex = 0; cardSessionDone = 0;
  renderCard();
}

function renderCard() {
  lastRender = renderCard;
  if (cardIndex >= cardQueue.length) return renderCardsResult();
  cardFlipped = false;
  const word = cardQueue[cardIndex];
  const card = getCard(word.en);
  const total = cardQueue.length;
  const percent = (cardIndex / total) * 100;
  const dir = settings.direction === 'mix'
    ? (Math.random() < 0.5 ? 'en-ru' : 'ru-en') : settings.direction;
  const front = dir === 'en-ru' ? word.en : word.ru;
  const back  = dir === 'en-ru' ? word.ru : word.en;

  app.innerHTML = `
    ${topBar({ back: true, title: `Карточки · ${cardIndex + 1}/${total}`, onBack: () => {
      if (confirm('Выйти из карточек?')) renderHome();
    }})}

    <div class="quiz-progress-track mb-16">
      <div class="quiz-progress-fill" style="width:${percent}%"></div>
    </div>

    <div class="flashcard-wrap">
      <div class="flashcard" id="flashcard">
        <div class="flashcard-face flashcard-front">
          <div class="flashcard-badge">${card.reps === 0 ? 'Новая' : 'Повторение'}</div>
          <div class="flashcard-word">${escapeHtml(front)}</div>
          <div class="flashcard-tap-hint">Нажмите, чтобы показать ответ</div>
        </div>
        <div class="flashcard-face flashcard-back">
          <div class="flashcard-badge">Ответ</div>
          <div class="flashcard-word">${escapeHtml(back)}</div>
        </div>
      </div>
    </div>

    <div id="ratingArea"></div>
  `;
  bindTopBar({ onBack: () => { if (confirm('Выйти?')) renderHome(); } });

  const fc = document.getElementById('flashcard');
  fc.addEventListener('click', () => flipCard(word, front, back));
}

function flipCard(word, front, back) {
  if (cardFlipped) return;
  cardFlipped = true;
  document.getElementById('flashcard').classList.add('flipped');

  const card = getCard(word.en);

  // ИСПРАВЛЕНО: передаём копию карточки, чтобы schedule() не мутировал оригинал.
  // Иначе первый вызов (Again) меняет interval=0, и все последующие кнопки показывают одно и то же.
  const preview = {
    again: schedule({ ...card }, 0).interval,
    hard:  schedule({ ...card }, 1).interval,
    good:  schedule({ ...card }, 2).interval,
    easy:  schedule({ ...card }, 3).interval,
  };

  const area = document.getElementById('ratingArea');
  area.innerHTML = `
    <div class="rating-grid" style="margin-top:16px;">
      <button class="rating-btn again" data-q="0">Again<span class="rating-interval">${intervalLabel(preview.again)}</span></button>
      <button class="rating-btn hard"  data-q="1">Hard<span class="rating-interval">${intervalLabel(preview.hard)}</span></button>
      <button class="rating-btn good"  data-q="2">Good<span class="rating-interval">${intervalLabel(preview.good)}</span></button>
      <button class="rating-btn easy"  data-q="3">Easy<span class="rating-interval">${intervalLabel(preview.easy)}</span></button>
    </div>
  `;
  area.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => rateCard(word, parseInt(btn.dataset.q, 10)));
  });
}

function rateCard(word, quality) {
  applyRating(word.en, quality);
  if (quality === 0) { markDifficult(word.en); cardQueue.push(word); }
  else if (quality >= 2) markCorrectDifficult(word.en);
  cardSessionDone++;
  incrementDailyCount(1); updateStreak();
  cardIndex++; renderCard();
}

function renderStats() {
  lastRender = renderStats;
  const statuses = { new: 0, learning: 0, young: 0, mature: 0 };
  const rows = getWords().map(w => {
    const c = getProgress()[w.en];
    const st = wordStatus(w.en);
    statuses[st]++;
    return { en: w.en, ru: w.ru, st, difficult: isDifficult(w.en),
      interval: c ? c.interval : 0, ease: c ? c.ease.toFixed(2) : '—',
      due: c ? c.due : '—', reps: c ? c.reps : 0, lapses: c ? c.lapses : 0 };
  });
  const dueCount = rows.filter(r => r.due !== '—' && r.due <= todayStr()).length;
  const diffCount = rows.filter(r => r.difficult).length;
  const last14 = [];
  for (let i = 13; i >= 0; i--) { const d = addDays(-i); last14.push({ date: d, count: stats.dailyCounts[d] || 0 }); }
  const maxCount = Math.max(1, ...last14.map(d => d.count));

  app.innerHTML = `
    ${topBar({ back: true, title: 'Статистика', onBack: renderHome })}

    <div class="mini-stats">
      <div class="stat-pill streak">

      <div class="stat-pill due">

        <div class="stat-pill-label">К повтору</div>
      </div>
      <div class="stat-pill difficult">
        <div class="stat-pill-value">${diffCount}</div>
        <div class="stat-pill-label">Сложных</div>
      </div>
    </div>

    <h2 class="section-title">Статусы слов</h2>
    <div class="card mb-16" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div><span class="tag new">Новые</span> <b style="margin-left:6px;">${statuses.new}</b></div>
      <div><span class="tag learning">Учатся</span> <b style="margin-left:6px;">${statuses.learning}</b></div>
      <div><span class="tag young">Молодые</span> <b style="margin-left:6px;">${statuses.young}</b></div>
      <div><span class="tag mature">Зрелые</span> <b style="margin-left:6px;">${statuses.mature}</b></div>
    </div>

    <h2 class="section-title">Активность за 14 дней</h2>
    <div class="chart mb-16">
      ${last14.map(d => `
        <div class="chart-bar">
          <div class="chart-bar-fill" style="height:${Math.round(d.count / maxCount * 70)}px;opacity:${d.count ? 1 : 0.2};"></div>
          <div class="chart-bar-label">${d.date.slice(8)}</div>
        </div>
      `).join('')}
    </div>

    <h2 class="section-title">Все слова (${rows.length})</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>EN</th><th>RU</th><th>Статус</th><th>Интервал</th><th>След.</th><th>Ошибок</th></tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td><b>${escapeHtml(r.en)}</b></td>
              <td>${escapeHtml(r.ru)}</td>
              <td>${r.difficult ? '<span class="tag difficult">!</span> ' : ''}<span class="tag ${r.st}">${statusName(r.st)}</span></td>
              <td>${r.interval ? intervalLabel(r.interval) : '—'}</td>
              <td>${r.due}</td>
              <td>${r.lapses}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    ${bottomNav('stats')}
  `;
  bindTopBar({ onBack: renderHome });
  bindBottomNav();
}

function renderReminders() {
  lastRender = renderReminders;
  const perm = notificationPermission();
  const supported = notificationsSupported();
  let statusClass = 'off', statusText = '';
  if (!supported) { statusText = 'Браузер не поддерживает уведомления.'; }
  else if (perm === 'granted') { statusClass = 'ok'; statusText = '✓ Уведомления разрешены'; }
  else if (perm === 'denied') { statusText = '⛔ Уведомления запрещены. Разрешите в настройках браузера.'; }
  else { statusClass = 'warn'; statusText = 'Разрешение не запрошено'; }

  app.innerHTML = `
    ${topBar({ back: true, title: 'Напоминания', onBack: renderMore })}

    <p class="text-dim mb-16" style="font-size:14px;line-height:1.6;">
      Приложение напомнит заниматься, если вы давно не открывали тренажёр. Показывается только если сегодня ещё не занимались.
    </p>

    <div class="status-banner ${statusClass}">${statusText}</div>

    ${supported && perm !== 'granted' ? `
      <button class="btn full mb-16" id="btnGrant">${ICONS.bell} Разрешить уведомления</button>
    ` : ''}

    <div class="card mb-16">
      <div class="form-row">
        <label>Напоминания</label>
        <label class="toggle">
          <input type="checkbox" id="remEnabled" ${reminder.enabled ? 'checked' : ''}>
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span>${reminder.enabled ? 'Включены' : 'Выключены'}</span>
        </label>
      </div>
      <div class="form-row">
        <label>Время</label>
        <input class="input" type="time" id="remTime" value="${reminder.time}">
      </div>
    </div>

    <button class="btn secondary full mb-16" id="btnTest">📨 Тестовое уведомление</button>

    <p class="text-muted" style="font-size:12px;line-height:1.6;">
      <b>Важно:</b> напоминания работают, пока вкладка с сайтом открыта (можно в фоне).
    </p>
    ${bottomNav('more')}
  `;
  bindTopBar({ onBack: renderMore });
  bindBottomNav();

  const grantBtn = document.getElementById('btnGrant');
  if (grantBtn) grantBtn.addEventListener('click', async () => {
    const res = await requestNotificationPermission();
    if (res === 'granted') { alert('Уведомления разрешены!'); renderReminders(); }
    else if (res === 'denied') alert('Вы запретили уведомления. Разрешите в настройках браузера.');
  });

  document.getElementById('remEnabled').addEventListener('change', async e => {
    reminder.enabled = e.target.checked;
    saveReminder();
    if (reminder.enabled) {
      const p = await requestNotificationPermission();
      if (p === 'granted') checkReminder();
    }
    renderReminders();
  });
  document.getElementById('remTime').addEventListener('change', e => {
    reminder.time = e.target.value; saveReminder();
  });
  document.getElementById('btnTest').addEventListener('click', async () => {
    if (notificationPermission() !== 'granted') {
      const res = await requestNotificationPermission();
      if (res !== 'granted') { alert('Сначала разрешите уведомления.'); return; }
    }
    testNotification();
  });
}

    <h2 class="section-title">Импорт слов в колоду</h2>
    <div class="card mb-16">
      <p class="text-dim mb-16" style="font-size:13px;">TXT · CSV · TSV</p>
      <div class="io-actions">
        <button class="btn btn-compact" id="impFile">${ICONS.upload} Загрузить файл</button>
      </div>
      <input type="file" id="impInput" accept=".txt,.csv,.tsv" style="display:none;">
      <p class="text-muted mt-16" style="font-size:12px;" id="impMsg"></p>
    </div>

    <h2 class="section-title">Экспорт колоды</h2>
    <div class="card mb-16">
      <div class="io-actions">
        <button class="btn btn-compact" id="expCSV">CSV</button>
        <button class="btn btn-compact" id="expTXT">TXT</button>
        <button class="btn btn-compact" id="expTSV">TSV</button>
      </div>
    </div>

    <h2 class="section-title">Полный бэкап</h2>
    <div class="card mb-16">
      <p class="text-dim mb-16" style="font-size:13px;">Все колоды, прогресс, настройки, статистика.</p>
      <div class="io-actions">
        <button class="btn btn-compact" id="expAll">${ICONS.download} Скачать всё</button>
        <button class="btn secondary btn-compact" id="impAll">${ICONS.upload} Загрузить всё</button>
      </div>
      <input type="file" id="impAllInput" accept=".json" style="display:none;">
      <p class="text-muted mt-16" style="font-size:12px;" id="allMsg"></p>
    </div>
    ${bottomNav('more')}
  `;
  bindTopBar({ onBack: renderMore });
  bindBottomNav();

  document.getElementById('impFile').addEventListener('click', () => document.getElementById('impInput').click());
  document.getElementById('impInput').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const text = ev.target.result;
      const parsed = file.name.toLowerCase().endsWith('.csv') ? parseCSV(text) : parseAny(text);
      if (!parsed || parsed.length === 0) {
        document.getElementById('impMsg').textContent = 'Не найдено слов.';
        document.getElementById('impMsg').style.color = 'var(--danger)'; return;
      }
      const replace = getWords().length > 0
        ? confirm(`Найдено ${parsed.length}.\n\nOK — добавить\nОтмена — заменить`)
        : true;
      if (replace) {
        const existing = new Set(getWords().map(w => w.en + '|' + w.ru));
        parsed.forEach(w => { if (!existing.has(w.en + '|' + w.ru)) getWords().push(w); });
        setWords(getWords());
      } else {
        setWords(parsed);
        progressByDeck[activeDeckId] = {};
        difficultByDeck[activeDeckId] = {};
        saveProgressMap(); saveDifficultMap();
      }
      document.getElementById('impMsg').textContent = `Импортировано: ${parsed.length}.`;
      document.getElementById('impMsg').style.color = 'var(--success)';
    };
    reader.readAsText(file, 'UTF-8');
  });

  document.getElementById('expCSV').addEventListener('click', () => download('\uFEFF' + toCSV(getWords()), 'deck-' + todayStr() + '.csv', 'text/csv'));
  document.getElementById('expTXT').addEventListener('click', () => download(toTSV(getWords()), 'deck-' + todayStr() + '.txt'));
  document.getElementById('expTSV').addEventListener('click', () => download(toTSV(getWords()), 'deck-' + todayStr() + '.tsv'));
  document.getElementById('expAll').addEventListener('click', () => {
    const data = { version: 5, decks, activeDeckId, wordsByDeck, progressByDeck,
      difficultByDeck, settings, stats, reminder, theme, exported: new Date().toISOString() };
    download(JSON.stringify(data, null, 2), 'aeroen-full-' + todayStr() + '.json', 'application/json');
  });
  document.getElementById('impAll').addEventListener('click', () => document.getElementById('impAllInput').click());
  document.getElementById('impAllInput').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if (!d.decks || !d.wordsByDeck) throw new Error('Неверный формат');
        if (!confirm('Заменить ВСЕ данные?')) return;
        decks = d.decks; activeDeckId = d.activeDeckId || (decks[0] && decks[0].id);
        wordsByDeck = d.wordsByDeck; progressByDeck = d.progressByDeck || {};
        difficultByDeck = d.difficultByDeck || {};
        settings = Object.assign(settings, d.settings || {});
        stats = Object.assign(stats, d.stats || {});
        reminder = Object.assign(reminder, d.reminder || {});
        if (d.theme) theme = d.theme;
        applyTheme();
        saveAll();
        document.getElementById('allMsg').textContent = 'Импорт успешен.';
        document.getElementById('allMsg').style.color = 'var(--success)';
        setTimeout(renderHome, 700);
      } catch (err) {
        document.getElementById('allMsg').textContent = 'Ошибка: ' + err.message;
        document.getElementById('allMsg').style.color = 'var(--danger)';
      }
    };
    reader.readAsText(file, 'UTF-8');
  });
}

/* =========================================================================
   СТАРТ
   ========================================================================= */
(async function init() {
  initPWA();
  loadAll();
  await loadSystemDecks();
  startReminderLoop();
  renderHome();
})();
</script>
</body>
</html>
